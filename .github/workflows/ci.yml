name: CI

on:
  push:
    branches: [stag-dev, v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, sqlite3, pdo_sqlite, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage --configuration phpunit.dist.xml
